<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐣 보안 병아리 관리자</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f5f7fb;
  color:#182230
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:24px
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 6px 24px #0000000d;
  margin-bottom:18px
}

h1{
  margin:0 0 6px
}

h2{
  margin-top:0
}

.muted{
  color:#667085
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.stat{
  padding:18px;
  border-radius:15px;
  background:#f7f9fc
}

.stat b{
  font-size:28px;
  display:block;
  margin-top:8px
}

input,
select,
textarea,
button{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  border:1px solid #d8dee8;
  border-radius:10px;
  font-size:14px;
  margin:4px 0
}

button{
  background:#182230;
  color:#fff;
  cursor:pointer
}

button:hover{
  opacity:.9
}

.primary{
  background:#ffd54f;
  color:#4b3b00;
  border:0;
  font-weight:700
}

.logout{
  max-width:120px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,
td{
  text-align:left;
  padding:10px;
  border-bottom:1px solid #edf0f4;
  vertical-align:top
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  background:#eef3ff;
  margin:2px;
  font-size:12px
}

.hide{
  display:none!important
}

.login{
  max-width:480px;
  margin:12vh auto
}

.question-card{
  border:1px solid #edf0f4;
  box-shadow:none
}

summary{
  cursor:pointer;
  line-height:1.5
}

label{
  display:block;
  margin-top:10px;
  font-size:13px;
  font-weight:700
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  table{
    display:block;
    overflow:auto;
    white-space:nowrap
  }

}

@media(max-width:500px){

  .wrap{
    padding:12px
  }

  .grid{
    grid-template-columns:1fr 1fr
  }

}
</style>
</head>


<body>


<!-- =========================
     관리자 로그인
========================= -->

<div id="login" class="card login">

  <h1>🐣 보안 병아리 관리자</h1>

  <p class="muted">
    관리자 이메일로 로그인 링크를 보내드립니다.
  </p>

  <input
    id="email"
    value="dlalswjd4276@naver.com"
    readonly>

  <button
    class="primary"
    onclick="login()">

    관리자 로그인 링크 보내기

  </button>

  <p
    id="loginMsg"
    class="muted">
  </p>

</div>


<!-- =========================
     관리자 Dashboard
========================= -->

<div
  id="app"
  class="wrap hide">


  <!-- HEADER -->

  <div class="card">

    <h1>🐣 보안 병아리 관리자</h1>

    <p class="muted">
      보안 퀴즈 이벤트 운영 현황을 관리합니다.
    </p>

    <button
      class="logout"
      onclick="logout()">

      로그아웃

    </button>

  </div>


  <!-- =========================
       통계
  ========================= -->

  <div class="grid">

    <div class="stat">

      총 접속

      <b id="visits">
        -
      </b>

    </div>


    <div class="stat">

      참가자

      <b id="participants">
        -
      </b>

    </div>


    <div class="stat">

      퀴즈 시도

      <b id="attempts">
        -
      </b>

    </div>


    <div class="stat">

      완료율

      <b id="completion">
        -
      </b>

    </div>

  </div>


  <!-- =========================
       퀴즈 설정
  ========================= -->

  <div class="card">

    <h2>
      🗓️ 퀴즈 기간 / 출제 설정
    </h2>

    <div class="grid">


      <div>

        <label>
          시작일시
        </label>

        <input
          id="startAt"
          type="datetime-local">

      </div>


      <div>

        <label>
          종료일시
        </label>

        <input
          id="endAt"
          type="datetime-local">

      </div>


      <div>

        <label>
          전체 문제 수
        </label>

        <input
          id="qCount"
          type="number"
          min="1">

      </div>


      <div>

        <label>
          쉬움
        </label>

        <input
          id="easy"
          type="number"
          min="0">

      </div>


      <div>

        <label>
          보통
        </label>

        <input
          id="medium"
          type="number"
          min="0">

      </div>


      <div>

        <label>
          어려움
        </label>

        <input
          id="hard"
          type="number"
          min="0">

      </div>

    </div>


    <button
      class="primary"
      onclick="saveSettings()">

      💾 설정 저장

    </button>

  </div>


  <!-- =========================
       TOP 10
  ========================= -->

  <div class="card">

    <h2>
      🏆 현재 보안 병아리 TOP 10
    </h2>

    <table>

      <thead>

        <tr>
          <th>순위</th>
          <th>닉네임</th>
          <th>정답</th>
          <th>시간</th>
          <th>점수</th>
        </tr>

      </thead>

      <tbody id="leaders">
      </tbody>

    </table>

  </div>


  <!-- =========================
       문제 관리
  ========================= -->

  <div class="card">

    <h2>
      📚 문제 관리
    </h2>

    <p class="muted">
      문제의 난이도, 주제, 활성 여부,
      트렌드 여부를 관리할 수 있습니다.
    </p>

    <div id="questions">
    </div>

  </div>


</div>


<script>

/* ==========================================
   Supabase 설정
========================================== */

const SUPABASE_URL =
"https://fwfdldjgfulbjkqasgur.supabase.co";


const SUPABASE_KEY =
"sb_publishable_zd4g1OUE0gKJKD4kTNH3sQ_ouojAgd7";


const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const ADMIN_EMAIL =
"dlalswjd4276@naver.com";


const API =
SUPABASE_URL +
"/functions/v1/admin-api";


/* ==========================================
   로그인
========================================== */

async function login(){

  try{

    const {
      data,
      error
    } =
      await sb.auth.signInWithOtp({

        email:
          ADMIN_EMAIL,

        options:{
          emailRedirectTo:
            location.href
        }

      });


    if(error){

      throw error;

    }


    document
      .getElementById("loginMsg")
      .textContent =
      "📩 로그인 링크를 이메일로 보냈습니다. 메일을 확인해주세요.";

  }

  catch(e){

    document
      .getElementById("loginMsg")
      .textContent =
      "로그인 메일을 보내지 못했습니다: " +
      e.message;

  }

}


/* ==========================================
   현재 세션 확인
========================================== */

async function session(){

  const {
    data
  } =
    await sb.auth.getSession();


  if(data.session){

    document
      .getElementById("login")
      .classList
      .add("hide");


    document
      .getElementById("app")
      .classList
      .remove("hide");


    load();

  }

}


/* ==========================================
   관리자 API
========================================== */

async function api(
  action,
  body={}
){

  const {
    data
  } =
    await sb.auth.getSession();


  if(!data.session){

    throw new Error(
      "로그인이 필요합니다."
    );

  }


  const response =
    await fetch(

      API,

      {

        method:"POST",

        headers:{

          "Authorization":
            "Bearer " +
            data.session.access_token,

          "content-type":
            "application/json"

        },

        body:
          JSON.stringify({

            action,

            ...body

          })

      }

    );


  const result =
    await response.json();


  if(!response.ok){

    throw new Error(
      result.error ||
      "관리자 API 오류"
    );

  }


  return result;

}


/* ==========================================
   날짜 변환
========================================== */

function datetimeLocal(
  value
){

  if(!value){

    return "";

  }


  const d =
    new Date(value);


  const pad =
    n =>
    String(n)
      .padStart(2,"0");


  return (

    d.getFullYear() +

    "-" +

    pad(
      d.getMonth()+1
    ) +

    "-" +

    pad(
      d.getDate()
    ) +

    "T" +

    pad(
      d.getHours()
    ) +

    ":" +

    pad(
      d.getMinutes()
    )

  );

}


/* ==========================================
   Dashboard 불러오기
========================================== */

async function load(){

  try{

    const x =
      await api(
        "dashboard"
      );


    /* 통계 */

    document
      .getElementById("visits")
      .textContent =
      x.stats.visits;


    document
      .getElementById("participants")
      .textContent =
      x.stats.participants;


    document
      .getElementById("attempts")
      .textContent =
      x.stats.attempts;


    document
      .getElementById("completion")
      .textContent =
      x.stats.completion_rate +
      "%";


    /* 설정 */

    document
      .getElementById("startAt")
      .value =
      datetimeLocal(
        x.settings.start_at
      );


    document
      .getElementById("endAt")
      .value =
      datetimeLocal(
        x.settings.end_at
      );


    document
      .getElementById("qCount")
      .value =
      x.settings.question_count;


    document
      .getElementById("easy")
      .value =
      x.settings.easy_count;


    document
      .getElementById("medium")
      .value =
      x.settings.medium_count;


    document
      .getElementById("hard")
      .value =
      x.settings.hard_count;


    /* 순위 */

    renderLeaders(
      x.leaders
    );


    /* 문제 */

    renderQuestions(
      x.questions
    );

  }

  catch(e){

    alert(
      "Dashboard를 불러오지 못했습니다.\n\n" +
      e.message
    );

  }

}


/* ==========================================
   TOP 10
========================================== */

function renderLeaders(
  list
){

  const medals = [
    "🥇",
    "🥈",
    "🥉"
  ];


  document
    .getElementById("leaders")
    .innerHTML =

    (list || [])
      .map(

        (v,i)=>`

          <tr>

            <td>
              ${
                medals[i] ||
                (i+1) + "위"
              }
            </td>

            <td>
              ${
                escapeHtml(
                  v.nickname
                )
              }
            </td>

            <td>
              ${v.best_correct}/10
            </td>

            <td>
              ${v.best_seconds}초
            </td>

            <td>
              ${v.best_score}
            </td>

          </tr>

        `

      )
      .join("");

}


/* ==========================================
   퀴즈 설정 저장
========================================== */

async function saveSettings(){

  const q =
    Number(
      document
        .getElementById("qCount")
        .value
    );


  const easy =
    Number(
      document
        .getElementById("easy")
        .value
    );


  const medium =
    Number(
      document
        .getElementById("medium")
        .value
    );


  const hard =
    Number(
      document
        .getElementById("hard")
        .value
    );


  if(
    q !==
    easy +
    medium +
    hard
  ){

    alert(
      "전체 문제 수와 난이도별 문제 수의 합계를 맞춰주세요."
    );

    return;

  }


  try{

    await api(

      "settings",

      {

        start_at:
          new Date(
            document
              .getElementById("startAt")
              .value
          ).toISOString(),

        end_at:
          new Date(
            document
              .getElementById("endAt")
              .value
          ).toISOString(),

        question_count:q,

        easy_count:easy,

        medium_count:medium,

        hard_count:hard

      }

    );


    alert(
      "🐣 퀴즈 설정을 저장했습니다!"
    );


    load();

  }

  catch(e){

    alert(
      "저장하지 못했습니다.\n\n" +
      e.message
    );

  }

}


/* ==========================================
   문제 목록
========================================== */

function renderQuestions(
  list
){

  document
    .getElementById("questions")
    .innerHTML =

    (list || [])
      .map(

        q => `

        <details
          class="card question-card">

          <summary>

            <b>
              ${
                escapeHtml(
                  q.question
                )
              }
            </b>

            <span
              class="badge">

              ${
                escapeHtml(
                  q.difficulty
                )
              }

            </span>

            ${
              q.is_trending

              ?

              `<span
                 class="badge">
                 🔥 트렌드
               </span>`

              :

              ""

            }

            ${
              !q.active

              ?

              `<span
                 class="badge">
                 비활성
               </span>`

              :

              ""

            }

          </summary>


          <label>
            문제
          </label>

          <textarea
            id="q_${q.id}"
            rows="3">

${escapeHtml(q.question)}

          </textarea>


          <label>
            난이도
          </label>

          <select
            id="d_${q.id}">

            <option
              value="쉬움"
              ${
                q.difficulty ===
                "쉬움"
                ?
                "selected"
                :
                ""
              }>
              쉬움
            </option>

            <option
              value="보통"
              ${
                q.difficulty ===
                "보통"
                ?
                "selected"
                :
                ""
              }>
              보통
            </option>

            <option
              value="어려움"
              ${
                q.difficulty ===
                "어려움"
                ?
                "selected"
                :
                ""
              }>
              어려움
            </option>

          </select>


          <label>
            주제
          </label>

          <input
            id="t_${q.id}"
            value="${
              escapeHtml(
                q.topic || ""
              )
            }">


          <label>
            활성 여부
          </label>

          <select
            id="a_${q.id}">

            <option
              value="true"
              ${
                q.active
                ?
                "selected"
                :
                ""
              }>
              활성
            </option>

            <option
              value="false"
              ${
                !q.active
                ?
                "selected"
                :
                ""
              }>
              비활성
            </option>

          </select>


          <label>
            트렌드 여부
          </label>

          <select
            id="tr_${q.id}">

            <option
              value="false"
              ${
                !q.is_trending
                ?
                "selected"
                :
                ""
              }>
              일반 문제
            </option>

            <option
              value="true"
              ${
                q.is_trending
                ?
                "selected"
                :
                ""
              }>
              🔥 트렌드 문제
            </option>

          </select>


          <button
            onclick="
              saveQuestion(
                '${q.id}'
              )
            ">

            💾 문제 설정 저장

          </button>

        </details>

        `

      )

      .join("");

}


/* ==========================================
   문제 저장
========================================== */

async function saveQuestion(
  id
){

  try{

    /*
      현재 문제의 보기/정답 정보는
      기존 DB 값을 유지합니다.
    */

    const dashboard =
      await api(
        "dashboard"
      );


    const current =
      dashboard.questions
        .find(
          x =>
          x.id === id
        );


    if(!current){

      throw new Error(
        "문제를 찾을 수 없습니다."
      );

    }


    await api(

      "question_update",

      {

        id:id,

        question:
          document
            .getElementById(
              "q_" + id
            )
            .value,

        options:
          current.options,

        correct_index:
          current.correct_index,

        difficulty:
          document
            .getElementById(
              "d_" + id
            )
            .value,

        topic:
          document
            .getElementById(
              "t_" + id
            )
            .value,

        active:
          document
            .getElementById(
              "a_" + id
            )
            .value === "true",

        is_trending:
          document
            .getElementById(
              "tr_" + id
            )
            .value === "true"

      }

    );


    alert(
      "🐣 문제를 저장했습니다!"
    );


    load();

  }

  catch(e){

    alert(
      "문제를 저장하지 못했습니다.\n\n" +
      e.message
    );

  }

}


/* ==========================================
   HTML Escape
========================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ==========================================
   로그아웃
========================================== */

async function logout(){

  await sb.auth.signOut();

  location.reload();

}


/* ==========================================
   인증 상태 변화
========================================== */

sb.auth.onAuthStateChange(
  function(){

    session();

  }
);


/* ==========================================
   시작
========================================== */

session();

</script>

</body>
</html>
